<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albion — Calculateur Cuisine & Potions</title>
<style>
  :root{
    --bg:#121212; --panel:#1e1e1e; --panel2:#252525; --line:#333; --line2:#444;
    --gold:#f3a918; --txt:#e0e0e0; --muted:#8a8a8a;
    --green:#4caf50; --red:#ff5252; --blue:#4aa3df;
  }
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:14px}
  h1{color:var(--gold);font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  a{color:var(--blue)}

  /* ---- Onglets ---- */
  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--line)}
  .tab{padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);
    border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-2px}
  .tab:hover{color:var(--txt)}
  .tab.on{color:var(--gold);background:var(--panel);border-color:var(--line);border-bottom:2px solid var(--panel)}

  /* ---- Settings bar ---- */
  .settings{background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field>label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
  .cities{display:flex;flex-wrap:wrap;gap:5px 10px}
  .cities label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;white-space:nowrap}
  select,input[type=number]{background:var(--bg);border:1px solid var(--line2);color:var(--txt);
    padding:7px 8px;border-radius:6px;font-size:13px;width:100%}
  input[type=number]{width:110px}
  .toggle{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
  .row-inline{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:10px}
  button{background:var(--gold);color:#121212;border:none;padding:9px 14px;border-radius:6px;
    font-weight:700;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  button:disabled{opacity:.5;cursor:default}
  .status{font-size:12px;color:var(--muted)}
  .status.err{color:var(--red)}

  /* ---- Table ---- */
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;z-index:10;background:var(--panel2);color:var(--gold);text-align:right;
    padding:11px 12px;font-size:12px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
  thead th.left{text-align:left}
  thead th .arrow{opacity:.5;font-size:10px;margin-left:3px}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;text-align:right;vertical-align:middle}
  tbody td.left{text-align:left}
  tbody tr.main{cursor:pointer}
  tbody tr.main:hover{background:#242424}
  .item-cell{display:flex;align-items:center;gap:10px;text-align:left}
  .item-img{width:38px;height:38px;background:var(--panel2);border-radius:5px;border:1px solid var(--line);flex:0 0 auto}
  .item-name{font-weight:600;line-height:1.15}
  .item-id{font-size:10px;color:var(--muted)}
  .tier-badge{display:inline-block;padding:1px 6px;border-radius:4px;background:#2a2a2a;border:1px solid var(--line2);
    font-size:11px;font-weight:700;color:#cfcfcf}
  .ench{color:var(--gold)}
  .pos{color:var(--green);font-weight:700}
  .neg{color:var(--red);font-weight:700}
  .na{color:var(--muted)}
  .pill{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--line2);color:var(--muted)}
  .pill.cook{color:#ffcf7a;border-color:#5a4527}
  .pill.alch{color:#b69cff;border-color:#3e3466}
  .caret{display:inline-block;width:14px;color:var(--muted)}

  /* ---- Detail ---- */
  tr.detail td{background:#181818;padding:0}
  .detail-box{padding:12px 14px 16px}
  .detail-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}
  .ing{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #242424}
  .ing:last-child{border-bottom:none}
  .ing-img{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
  .ing-name{font-size:13px}
  .ing-qty{color:var(--muted);font-size:11px}
  .methods{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .method{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
  .method.win{border-color:var(--green);color:#bfe6c0;background:rgba(76,175,80,.08)}
  .method.clickable{cursor:pointer;transition:border-color .12s}
  .method.clickable:hover{border-color:var(--gold)}
  .method .where{color:var(--gold)}
  .forced{font-size:10px;padding:3px 8px;border-radius:6px;color:var(--gold);border:1px dashed var(--gold);align-self:center}
  .manual-input{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px}
  .manual-input input{width:120px}
  .totals{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .totals .t{font-size:12px}
  .totals .t b{display:block;font-size:15px;color:var(--txt);margin-top:2px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .hidden-bar{margin:10px 2px 0;padding:9px 13px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;font-size:13px;color:var(--muted)}
  .hidden-bar a{font-weight:700;margin-left:6px}
  .legend{font-size:11px;color:var(--muted);margin:10px 2px 0;line-height:1.5}

  /* ---- Plan ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:22px;font-weight:700;margin-top:4px}
  .kpi.ok .v{color:var(--green)}
  .kpi.ko .v{color:var(--red)}
  .bloc{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .bloc>h3{margin:0;padding:11px 14px;font-size:13px;color:var(--gold);background:var(--panel2);
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bloc>h3 .meta{color:var(--muted);font-weight:400;font-size:12px}
  .bloc-body{padding:12px 14px}
  .ville-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 14px;background:#202020;border-bottom:1px solid var(--line);font-size:13px}
  .ville-head b{color:var(--gold)}
  .ville-head .chiffres{color:var(--muted);font-size:12px}
  .ptable{width:100%;border-collapse:collapse}
  .ptable th{background:transparent;position:static;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.4px;padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);cursor:default}
  .ptable th.left{text-align:left}
  .ptable td{padding:8px 10px;border-bottom:1px solid #262626;font-size:13px;text-align:right}
  .ptable td.left{text-align:left}
  .ptable tr:last-child td{border-bottom:none}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--line2);
    color:var(--muted);margin-left:6px;white-space:nowrap}
  .tag.warn{color:#ffcf7a;border-color:#5a4527;background:rgba(243,169,24,.08)}
  .tag.bride{color:var(--blue);border-color:#2d4d63}
  .bar{height:5px;background:#2a2a2a;border-radius:3px;overflow:hidden;margin-top:4px;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--gold)}
  .bar.full>i{background:var(--red)}
  .note{font-size:12px;color:var(--muted);line-height:1.55}
  .note b{color:var(--txt)}
  .motif{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #262626;font-size:12px}
  .motif:last-child{border-bottom:none}
  .motif .ex{color:var(--muted);font-size:11px}

  /* ---- Responsive : table -> cards ---- */
  @media(max-width:760px){
    thead{display:none}
    tbody tr.main{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
    tbody tr.main td{border:none;padding:2px 0;text-align:right}
    tbody tr.main td.left{grid-column:1 / -1;text-align:left}
    tbody td[data-label]::before{content:attr(data-label);float:left;color:var(--muted);font-size:11px;
      text-transform:uppercase;letter-spacing:.4px;margin-right:8px}
    tr.detail td{display:block}
    .ing{grid-template-columns:30px 1fr;}
    .methods{grid-column:1 / -1;justify-content:flex-start;margin-top:4px}
    .ptable thead{display:none}
    .ptable tr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 12px;border-bottom:1px solid var(--line)}
    .ptable td{border:none;padding:2px 0}
    .ptable td.left{grid-column:1 / -1}
    .ptable td[data-label]::before{content:attr(data-label);float:left;color:var(--muted);font-size:11px;
      text-transform:uppercase;letter-spacing:.4px;margin-right:8px}
  }
</style>
</head>
<body>
<div id="app">
  <h1>🍲 Albion — Calculateur Cuisine &amp; Potions</h1>
  <div class="sub">Serveur <b>Europe</b> · prix <b>albion-online-data</b></div>

  <div class="tabs">
    <div class="tab" :class="{on:onglet==='calc'}" @click="onglet='calc'">📊 Calculateur</div>
    <div class="tab" :class="{on:onglet==='plan'}" @click="onglet='plan'">🎯 Plan de profit</div>
  </div>

  <!-- ==================== ONGLET CALCULATEUR ==================== -->
  <template v-if="onglet==='calc'">
  <div class="sub">{{ displayRows.length }} recette(s) affichée(s) sur {{ totalDisplayable }}</div>

  <div class="settings">
    <div class="settings-grid">
      <div class="field" style="grid-column:1 / -1">
        <label>Villes prises en compte pour les prix (meilleur prix retenu)</label>
        <div class="cities">
          <label v-for="c in CITIES" :key="c">
            <input type="checkbox" :value="c" v-model="s.priceCities"> {{ c }}
          </label>
        </div>
      </div>

      <div class="field">
        <label>Ville de fabrication (bonus spécialité +15%)</label>
        <select v-model="s.craftCity">
          <option value="auto">Auto (idéale par recette)</option>
          <option v-for="c in CITIES" :key="c" :value="c">{{ c }}</option>
          <option value="none">Autre ville (sans bonus)</option>
        </select>
      </div>

      <div class="field">
        <label>Bonus événement</label>
        <select v-model.number="s.eventBonus">
          <option :value="0">Aucun (0%)</option>
          <option :value="10">Événement +10%</option>
          <option :value="20">Événement +20%</option>
        </select>
      </div>

      <div class="field">
        <label>Tarif station (silver / 100 nutrition)</label>
        <input type="number" min="0" step="50" v-model.number="s.stationFee">
      </div>

      <div class="field">
        <label>Source des graines (culture)</label>
        <select v-model="s.seedSource">
          <option value="cheapest">Le moins cher (PNJ vs marché)</option>
          <option value="npc">Marchand PNJ (île)</option>
          <option value="market">Marketplace des villes</option>
        </select>
      </div>

      <div class="field">
        <label>Prix graines PNJ — ajustement (Global Discount)</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="0" step="5" v-model.number="s.npcDiscount"> <span>%</span>
        </div>
      </div>

      <div class="field">
        <label>Seuil de marge minimum (profit ÷ coût)</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="-100" step="5" v-model.number="s.marginThreshold"> <span>%</span>
        </div>
      </div>

      <div class="field">
        <label>Filtrer par station</label>
        <select v-model="s.stationFilter">
          <option value="all">Toutes</option>
          <option value="cook">Cuisine</option>
          <option value="alchemist">Alchimie</option>
        </select>
      </div>

      <div class="field">
        <label>Filtrer par tier</label>
        <select v-model="s.tierFilter">
          <option value="all">Tous</option>
          <option v-for="t in [1,2,3,4,5,6,7,8]" :key="t" :value="t">T{{ t }}</option>
        </select>
      </div>

      <div class="field">
        <label>Filtrer par enchantement</label>
        <div class="cities">
          <label v-for="e in [0,1,2,3]" :key="e">
            <input type="checkbox" :value="e" v-model="s.enchFilter"> .{{ e }}
          </label>
        </div>
      </div>

      <div class="field">
        <label>Langue des noms</label>
        <select v-model="s.lang">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="row-inline">
      <label class="toggle"><input type="checkbox" v-model="s.focus"> Utiliser le <b>Focus</b> (craft +59% RRR · arrosage cultures)</label>
      <label class="toggle"><input type="checkbox" v-model="s.premium"> Compte <b>Premium</b> (taxe vente 6,5% · rendement ferme ×2)</label>
      <label class="toggle"><input type="checkbox" v-model="s.showMissing"> Afficher aussi les recettes à prix manquant</label>
      <button @click="fetchPrices(true)" :disabled="loading">{{ loading ? 'Chargement…' : '↻ Rafraîchir les prix' }}</button>
      <span class="status" :class="{err:error}">{{ error || statusText }}</span>
    </div>
  </div>

  <div class="tablewrap" v-if="ready">
    <table>
      <thead>
        <tr>
          <th class="left" @click="sortBy('name')">Recette <span class="arrow">{{ arrow('name') }}</span></th>
          <th @click="sortBy('tier')">Tier <span class="arrow">{{ arrow('tier') }}</span></th>
          <th @click="sortBy('cost')">Coût / u <span class="arrow">{{ arrow('cost') }}</span></th>
          <th @click="sortBy('sell')">Vente / u <span class="arrow">{{ arrow('sell') }}</span></th>
          <th @click="sortBy('profit')">Profit / u <span class="arrow">{{ arrow('profit') }}</span></th>
          <th @click="sortBy('margin')">Marge <span class="arrow">{{ arrow('margin') }}</span></th>
        </tr>
      </thead>
      <tbody>
        <template v-for="r in displayRows" :key="r.id">
          <tr class="main" @click="toggle(r.id)">
            <td class="left">
              <div class="item-cell">
                <span class="caret">{{ expanded[r.id] ? '▾' : '▸' }}</span>
                <img class="item-img" :src="img(r.id)" loading="lazy" @error="imgErr($event, r.id)" :alt="r.name">
                <div>
                  <div class="item-name">{{ r.name }}
                    <span v-if="r.enchantment" class="ench">@{{ r.enchantment }}</span></div>
                  <div class="item-id">
                    <span class="pill" :class="r.station==='cook'?'cook':'alch'">{{ r.station==='cook'?'Cuisine':'Alchimie' }}</span>
                    · produit ×{{ r.quantity }} · <span class="item-id">{{ r.id }}</span>
                  </div>
                </div>
              </div>
            </td>
            <td data-label="Tier"><span class="tier-badge">T{{ r.tier }}</span></td>
            <td data-label="Coût / u">{{ r.cost==null ? '—' : fmt(r.cost) }}</td>
            <td data-label="Vente / u" :class="{na:r.sell==null}">{{ r.sell==null ? 'prix manquant' : fmt(r.sell) }}</td>
            <td data-label="Profit / u" :class="profClass(r.profit)">{{ r.profit==null ? '—' : signed(r.profit) }}</td>
            <td data-label="Marge" :class="profClass(r.margin)">{{ r.margin==null ? '—' : (r.margin>0?'+':'')+r.margin.toFixed(0)+'%' }}</td>
          </tr>

          <tr class="detail" v-if="expanded[r.id]">
            <td colspan="6">
              <div class="detail-box">
                <p class="detail-title">Décomposition — clique une option pour la <b>forcer</b> dans le calcul (sinon le moins cher est utilisé)</p>
                <div class="ing" v-for="(ing,idx) in r.breakdown" :key="idx">
                  <img class="ing-img" :src="img(ing.id)" loading="lazy" @error="imgErr($event, ing.id)" :alt="ing.name">
                  <div>
                    <div class="ing-name">{{ ing.name }}</div>
                    <div class="ing-qty">×{{ ing.qty }} par craft<span v-if="ing.excluded"> · non retourné (RRR)</span></div>
                  </div>
                  <div class="methods">
                    <span v-for="m in ing.options" :key="m.method" class="method clickable"
                      :class="{win:m.method===ing.chosen}"
                      @click.stop="chooseMethod(r.id, ing.id, m.method)">
                      {{ methodLabel(m.method) }} {{ fmt(m.cost) }}
                      <span v-if="m.where" class="where">({{ m.where }})</span>
                    </span>
                    <span v-if="ing.overridden" class="forced">📌 forcé</span>
                    <span v-if="!ing.options.length" class="method na">prix manquant
                      <input type="number" style="width:90px;margin-left:6px" placeholder="silver"
                        @click.stop @change="setManual(ing.id, $event)"></span>
                  </div>
                </div>

                <div class="manual-input">
                  <span class="na">Prix de vente du produit fini :</span>
                  <input type="number" :placeholder="r.sell!=null?fmt(r.sell):'silver'"
                    @change="setManual(r.id, $event)">
                  <span class="na">(laisser vide = prix marché)</span>
                </div>

                <div class="totals">
                  <div class="t">Coût / craft<b>{{ r.craftCost==null?'—':fmt(r.craftCost) }}</b></div>
                  <div class="t">Coût / unité<b>{{ r.cost==null?'—':fmt(r.cost) }}</b></div>
                  <div class="t">Dont frais station<b>{{ fmt(r.stationFee) }}</b></div>
                  <div class="t">RRR appliqué<b>{{ (r.rrr*100).toFixed(1) }}%</b></div>
                  <div class="t">Vente nette / craft<b :class="r.sell==null?'na':''">{{ r.sell==null?'—':fmt(r.netRevenue) }}</b></div>
                  <div class="t">Profit / craft<b :class="profClass(r.profitCraft)">{{ r.profitCraft==null?'—':signed(r.profitCraft) }}</b></div>
                </div>
              </div>
            </td>
          </tr>
        </template>
        <tr v-if="!displayRows.length"><td colspan="6"><div class="empty">Aucune recette ne correspond aux filtres / au seuil de marge.</div></td></tr>
      </tbody>
    </table>
  </div>
  <div v-else class="empty">Chargement des données…</div>

  <div class="hidden-bar" v-if="ready && (hiddenByMargin>0 || ignoreThreshold)">
    <template v-if="!ignoreThreshold">
      🔻 <b>{{ hiddenByMargin }}</b> recette(s) masquée(s) car sous le seuil de {{ s.marginThreshold }}%.
      <a href="#" @click.prevent="ignoreThreshold=true">Tout afficher</a>
    </template>
    <template v-else>
      👁️ Toutes les recettes sont affichées (seuil ignoré).
      <a href="#" @click.prevent="ignoreThreshold=false">Masquer à nouveau celles sous {{ s.marginThreshold }}%</a>
    </template>
  </div>

  <p class="legend">
    💡 Coût = chemin le moins cher pour chaque ingrédient (achat marché, culture depuis graine, ou fabrication), RRR déduit selon ville/focus/événement.
    Culture : coût = prix graine × (1 − taux de retour) ÷ rendement (≈9 premium). Arrosée au focus, la graine se rembourse → coût ≈ 0.
    Frais de station = Item Value × 0,1125 × tarif/100 (calibrage à affiner). Profit = vente nette (taxe {{ s.premium?'6,5':'10,5' }}%) − coût de fabrication.
    <br>⚠️ Ce tableau classe par marge et ignore le volume échangé : une marge de 60% sur un item qui se vend 6 fois par jour ne rapporte rien.
    Pour un plan exécutable, va dans l'onglet <b>Plan de profit</b>.
  </p>
  </template>

  <!-- ==================== ONGLET PLAN ==================== -->
  <template v-if="onglet==='plan'">
  <div class="settings">
    <div class="settings-grid">
      <div class="field">
        <label>Capital disponible (silver)</label>
        <input type="number" min="0" step="1000000" v-model.number="p.capital" style="width:100%">
      </div>
      <div class="field">
        <label>Objectif de bénéfice (silver)</label>
        <input type="number" min="0" step="500000" v-model.number="p.objectif" style="width:100%">
      </div>
      <div class="field">
        <label>Part du volume quotidien captable</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="1" max="100" step="5" v-model.number="p.partVolume"> <span>%</span>
        </div>
      </div>
      <div class="field">
        <label>Volume minimum d'un marché</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="0" step="10" v-model.number="p.volumeMin"> <span>ventes/j</span>
        </div>
      </div>
      <div class="field">
        <label>Fraîcheur maximale du prix</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="1" step="1" v-model.number="p.maxAgeH"> <span>heures</span>
        </div>
      </div>
      <div class="field">
        <label>Bénéfice maximum sur un même item</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="1" max="100" step="5" v-model.number="p.partMaxItem"> <span>%</span>
        </div>
      </div>
      <div class="field">
        <label>Décote d'undercut sur le prix de vente</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" min="0" max="20" step="1" v-model.number="p.undercut"> <span>%</span>
        </div>
      </div>
      <div class="field">
        <label>Ville de fabrication</label>
        <select v-model="p.craftCity">
          <option value="auto">Auto (idéale par recette)</option>
          <option v-for="c in CITIES" :key="c" :value="c">{{ c }}</option>
          <option value="none">Autre ville (sans bonus)</option>
        </select>
      </div>
      <div class="field" style="grid-column:1 / -1">
        <label>🛒 Villes où j'accepte d'acheter les ingrédients</label>
        <div class="cities">
          <label v-for="c in CITIES" :key="c">
            <input type="checkbox" :value="c" v-model="p.villesAchat"> {{ c }}
          </label>
        </div>
      </div>
      <div class="field" style="grid-column:1 / -1">
        <label>💰 Villes où j'accepte de vendre</label>
        <div class="cities">
          <label v-for="c in CITIES" :key="c">
            <input type="checkbox" :value="c" v-model="p.villesVente"> {{ c }}
          </label>
        </div>
      </div>
    </div>

    <div class="row-inline">
      <button @click="calculerPlan" :disabled="!volumesCharges || calculEnCours">🎯 Calculer le plan</button>
      <button class="ghost" @click="fetchVolumes(true)" :disabled="chargementVolumes">↻ Recharger prix &amp; volumes</button>
      <button class="ghost" @click="viderCache">🗑 Vider le cache</button>
      <span class="status" :class="{err:error}">{{ error || statusText }}</span>
    </div>
  </div>

  <div v-if="!volumesCharges" class="empty">
    {{ chargementVolumes ? 'Chargement des volumes de vente (7 derniers jours)…' : 'Volumes non chargés.' }}
  </div>

  <template v-else-if="plan">
    <!-- Bandeau de résultat -->
    <div class="kpis">
      <div class="kpi" :class="plan.objectifAtteint?'ok':'ko'">
        <div class="k">Bénéfice du plan</div>
        <div class="v">{{ fmtM(plan.profitTotal) }}</div>
        <div class="note">{{ plan.objectifAtteint ? '✅ objectif atteint' : '❌ ' + Math.round(plan.profitTotal/p.objectif*100) + '% de l\'objectif' }}</div>
      </div>
      <div class="kpi">
        <div class="k">Capital mobilisé</div>
        <div class="v">{{ fmtM(plan.capitalUtilise) }}</div>
        <div class="note">sur {{ fmtM(p.capital) }} disponibles</div>
      </div>
      <div class="kpi">
        <div class="k">Rendement</div>
        <div class="v">{{ plan.capitalUtilise>0 ? Math.round(plan.profitTotal/plan.capitalUtilise*100)+'%' : '—' }}</div>
        <div class="note">bénéfice ÷ capital engagé</div>
      </div>
      <div class="kpi">
        <div class="k">Items distincts</div>
        <div class="v">{{ plan.nbItems }}</div>
        <div class="note">plafond {{ fmtM(plan.plafond) }} par item</div>
      </div>
      <div class="kpi">
        <div class="k">Lignes du plan</div>
        <div class="v">{{ plan.retenues.length }}</div>
        <div class="note">{{ planParVille.length }} ville(s) de vente</div>
      </div>
    </div>

    <div class="bloc" v-if="!plan.objectifAtteint">
      <h3>⚠️ Objectif non atteint</h3>
      <div class="bloc-body note">
        Le marché n'absorbe pas assez pour dégager {{ fmtM(p.objectif) }} en une journée avec ces réglages.
        Ce n'est presque jamais le capital qui bloque ({{ fmtM(plan.capitalUtilise) }} utilisés sur {{ fmtM(p.capital) }}),
        mais le débouché. Pour élargir : augmente la part du volume captable, baisse le volume minimum,
        coche plus de villes de vente, ou allonge l'horizon en acceptant d'écouler sur deux jours.
      </div>
    </div>

    <!-- Tournée : quoi vendre et où -->
    <div class="bloc" v-for="g in planParVille" :key="g.ville">
      <h3>
        <span>💰 Vendre à {{ g.ville }}</span>
        <span class="meta">{{ fmtM(g.profit) }} de bénéfice · {{ fmtM(g.investi) }} engagés</span>
      </h3>
      <table class="ptable">
        <thead>
          <tr>
            <th class="left">Produit</th>
            <th>Qté</th>
            <th>Coût / u</th>
            <th>Prix retenu</th>
            <th>Profit / u</th>
            <th>Bénéfice</th>
            <th>Part du marché</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="l in g.lignes" :key="l.id+l.villeVente">
            <td class="left">
              <div class="item-cell">
                <img class="ing-img" :src="img(l.id)" loading="lazy" @error="imgErr($event, l.id)" :alt="l.id">
                <div>
                  <div class="item-name">{{ nameOf(l.id) }}
                    <span v-if="l.enchantment" class="ench">@{{ l.enchantment }}</span>
                    <span class="tier-badge">T{{ l.tier }}</span>
                    <span v-if="l.aberrant" class="tag warn" :title="'Prix affiché ' + ratioFmt(l.ratio) + '× le prix réellement transigé — valorisé au prix réel'">
                      prix affiché {{ ratioFmt(l.ratio) }}× le réel
                    </span>
                    <span v-if="l.brideePar" class="tag bride" :title="'Quantité limitée par la liquidité de cet ingrédient'">
                      bridé par {{ nameOf(l.brideePar.id) }}
                    </span>
                  </div>
                  <div class="item-id">
                    <span class="pill" :class="l.station==='cook'?'cook':'alch'">{{ l.station==='cook'?'Cuisine':'Alchimie' }}</span>
                    · fabriquer {{ Math.ceil(l.q / l.quantity) }} craft(s) · {{ Math.round(l.vol) }} ventes/j sur ce marché
                    · prix relevé il y a {{ l.ageH.toFixed(1) }} h
                  </div>
                </div>
              </div>
            </td>
            <td data-label="Qté"><b>{{ fmt(l.q) }}</b></td>
            <td data-label="Coût / u">{{ fmt(l.coutU) }}</td>
            <td data-label="Prix retenu">
              {{ fmt(l.prixRetenu) }}
              <div class="item-id" v-if="Math.round(l.prixAffiche)!==Math.round(l.prixRetenu)">affiché {{ fmt(l.prixAffiche) }}</div>
            </td>
            <td data-label="Profit / u" class="pos">{{ signed(l.profitU) }}</td>
            <td data-label="Bénéfice" class="pos"><b>{{ fmt(l.profit) }}</b></td>
            <td data-label="Part du marché">
              {{ pct(l.partMarche) }}
              <div class="bar"><i :style="{width: Math.min(100, l.partMarche*100)+'%'}"></i></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Liste de courses : quoi acheter et où -->
    <div class="bloc" v-if="coursesParVille.length">
      <h3>
        <span>🛒 Liste de courses</span>
        <span class="meta">total {{ fmtM(plan.capitalUtilise) }}</span>
      </h3>
      <template v-for="g in coursesParVille" :key="g.ville">
        <div class="ville-head">
          <b>Acheter à {{ g.ville }}</b>
          <span class="chiffres">{{ g.items.length }} article(s) · {{ fmtM(g.cout) }}</span>
        </div>
        <table class="ptable">
          <tbody>
            <tr v-for="a in g.items" :key="g.ville+a.id">
              <td class="left">
                <div class="item-cell">
                  <img class="ing-img" :src="img(a.id)" loading="lazy" @error="imgErr($event, a.id)" :alt="a.id">
                  <div>
                    <div class="item-name">{{ nameOf(a.id) }}</div>
                    <div class="item-id">{{ a.id }}</div>
                  </div>
                </div>
              </td>
              <td data-label="Quantité"><b>{{ fmt(a.qte) }}</b></td>
              <td data-label="Prix / u">{{ fmt(a.prixU) }}</td>
              <td data-label="Coût total">{{ fmt(a.cout) }}</td>
            </tr>
          </tbody>
        </table>
      </template>
    </div>

    <!-- Exposition par item : contrôle de la règle des 15% -->
    <div class="bloc">
      <h3>
        <span>⚖️ Exposition par item</span>
        <span class="meta">règle : max {{ p.partMaxItem }}% du bénéfice, soit {{ fmtM(plan.plafond) }}</span>
      </h3>
      <table class="ptable">
        <tbody>
          <tr v-for="e in expositionItems" :key="e.id">
            <td class="left">{{ e.name }}</td>
            <td data-label="Bénéfice">{{ fmt(e.profit) }}</td>
            <td data-label="Part">
              {{ e.part.toFixed(1) }}%
              <div class="bar" :class="{full:e.plafondAtteint}"><i :style="{width: Math.min(100, e.part/p.partMaxItem*100)+'%'}"></i></div>
            </td>
            <td data-label="Statut">
              <span v-if="e.plafondAtteint" class="tag warn">plafond atteint</span>
              <span v-else class="na">ok</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Corrections anti-ordre-aberrant -->
    <div class="bloc" v-if="lignesCorrigees.length">
      <h3><span>🩹 Prix corrigés</span><span class="meta">{{ lignesCorrigees.length }} ligne(s)</span></h3>
      <div class="bloc-body">
        <p class="note" style="margin-top:0">
          Sur ces marchés, le prix affiché dépasse largement le prix auquel l'objet s'échange réellement :
          un vendeur isolé a posté un ordre que personne n'achète. Le plan les valorise au
          <b>prix réellement transigé</b>, jamais au prix affiché.
        </p>
        <table class="ptable">
          <tbody>
            <tr v-for="l in lignesCorrigees" :key="l.id+l.villeVente">
              <td class="left">{{ nameOf(l.id) }} <span class="na">— {{ l.villeVente }}</span></td>
              <td data-label="Affiché" class="na">{{ fmt(l.prixAffiche) }}</td>
              <td data-label="Réel">{{ fmt(l.prixReel) }}</td>
              <td data-label="Écart"><span class="tag warn">{{ ratioFmt(l.ratio) }}×</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Écartées -->
    <div class="bloc" v-if="ecarteesResume.length">
      <h3><span>🚫 Opportunités écartées</span><span class="meta">{{ ecarteesResume.reduce((a,b)=>a+b.n,0) }} au total</span></h3>
      <div class="bloc-body">
        <div class="motif" v-for="m in ecarteesResume" :key="m.motif">
          <div>
            <b>{{ m.n }}</b> — {{ m.motif }}
            <div class="ex">
              <span v-for="(e,i) in m.exemples" :key="i">
                {{ nameOf(e.id) }}<span v-if="e.ville"> ({{ e.ville }})</span><span v-if="e.detail"> {{ e.detail }}</span><span v-if="i<m.exemples.length-1"> · </span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="legend">
      🎯 Le plan retient, pour chaque couple recette × ville, le prix le plus bas entre le carnet d'ordres et
      le prix réellement transigé sur 7 jours, moins {{ p.undercut }}% d'undercut, puis déduit la taxe de vente
      ({{ s.premium?'6,5':'10,5' }}%). Les quantités sont plafonnées par quatre bornes : {{ p.partVolume }}% du volume
      quotidien du produit, {{ p.partVolume }}% du volume quotidien de chaque ingrédient acheté, le capital restant,
      et le plafond de {{ p.partMaxItem }}% du bénéfice par item.
      <br>❗ Calculé <b>sans focus</b> et <b>sans culture</b> : c'est un bénéfice plancher, réalisable dans la journée.
      Le focus (+59% de retour) et l'agriculture améliorent le résultat mais dépendent respectivement de ton pool de
      points et d'un cycle de 22 h.
      <br>❗ L'API ne publie pas la profondeur du carnet d'ordres. Acheter en masse fait monter ton propre prix
      d'achat : la borne sur la liquidité des ingrédients limite ce risque sans l'éliminer.
    </p>
  </template>
  <div v-else class="empty">Clique sur <b>Calculer le plan</b>.</div>
  </template>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
